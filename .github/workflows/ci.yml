name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig_tarball_key: x86_64-linux
            binary: mcp-node
          - os: macos-latest
            zig_tarball_key: aarch64-macos
            binary: mcp-node
          - os: windows-latest
            zig_tarball_key: x86_64-windows
            zig_archive: zip
            binary: mcp-node.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION=0.16.0
          INDEX=$(curl -fsSL https://ziglang.org/download/index.json)
          URL=$(printf '%s' "$INDEX" | jq -r --arg v "$ZIG_VERSION" --arg k "${{ matrix.zig_tarball_key }}" '.[$v][$k].tarball')
          SHA=$(printf '%s' "$INDEX" | jq -r --arg v "$ZIG_VERSION" --arg k "${{ matrix.zig_tarball_key }}" '.[$v][$k].shasum')
          mkdir -p "$RUNNER_TEMP/zig"
          if [ "${{ matrix.zig_archive }}" = "zip" ]; then
            curl -fsSL "$URL" -o "$RUNNER_TEMP/zig.zip"
            echo "$SHA  $RUNNER_TEMP/zig.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/zig.zip" -d "$RUNNER_TEMP/zig"
            mv "$RUNNER_TEMP/zig"/zig-*/* "$RUNNER_TEMP/zig/"
          else
            curl -fsSL "$URL" -o "$RUNNER_TEMP/zig.tar.xz"
            echo "$SHA  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          fi
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Check formatting
        shell: bash
        run: zig fmt --check .

      - name: Unit tests
        shell: bash
        run: zig build test

      - name: Release build
        shell: bash
        run: zig build -Doptimize=ReleaseSafe

      - name: Smoke test (auth gate + initialize)
        if: runner.os != 'Windows'
        shell: bash
        run: ci/smoke.sh

      - name: Smoke test (auth gate + initialize, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ci/smoke.ps1

      - name: Upload ReleaseSafe binary
        uses: actions/upload-artifact@v6
        with:
          name: mcp-node-${{ matrix.os }}
          path: zig-out/bin/${{ matrix.binary }}
          retention-days: 7
          if-no-files-found: error
