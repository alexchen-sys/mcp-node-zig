name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tls-server:
    # The opt-in -Dtls-server build: compiles mbedTLS in and exercises the
    # built-in TLS hub end to end. Default artifacts stay flagless.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION=0.16.0
          INDEX=$(curl -fsSL https://ziglang.org/download/index.json)
          URL=$(printf '%s' "$INDEX" | jq -r --arg v "$ZIG_VERSION" --arg k x86_64-linux '.[$v][$k].tarball')
          SHA=$(printf '%s' "$INDEX" | jq -r --arg v "$ZIG_VERSION" --arg k x86_64-linux '.[$v][$k].shasum')
          mkdir -p "$RUNNER_TEMP/zig"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$SHA  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Unit tests (-Dtls-server)
        shell: bash
        run: zig build -Dtls-server test

      - name: Release build (-Dtls-server)
        shell: bash
        run: zig build -Dtls-server -Doptimize=ReleaseSafe

      - name: Python reverse connect suite (-Dtls-server binary)
        shell: bash
        run: python3 ci/test_reverse.py

      - name: Python audit log suite (-Dtls-server binary)
        shell: bash
        run: python3 ci/test_audit.py

      - name: Built-in TLS hub smoke (-Dtls-server binary)
        shell: bash
        env:
          MCP_SMOKE_TLS_REQUIRE: '1'
        run: python3 ci/smoke_tls.py

      - name: Cross builds (-Dtls-server)
        # Runs last: every cross build replaces zig-out/bin/mcp-node.
        shell: bash
        run: |
          set -e
          zig build -Dtls-server -Dtarget=aarch64-linux -Doptimize=ReleaseSafe
          zig build -Dtls-server -Dtarget=aarch64-macos -Doptimize=ReleaseSafe
          zig build -Dtls-server -Dtarget=x86_64-windows -Doptimize=ReleaseSafe

  tls-smoke:
    # Built-in TLS hub end to end on macOS and Windows (Linux runs the full
    # suites in the tls-server job above).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            zig_tarball_key: aarch64-macos
            binary: mcp-node
          - os: windows-latest
            zig_tarball_key: x86_64-windows
            binary: mcp-node.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION=0.16.0
          INDEX=$(curl -fsSL https://ziglang.org/download/index.json)
          URL=$(printf '%s' "$INDEX" | jq -r --arg v "$ZIG_VERSION" --arg k "${{ matrix.zig_tarball_key }}" '.[$v][$k].tarball')
          SHA=$(printf '%s' "$INDEX" | jq -r --arg v "$ZIG_VERSION" --arg k "${{ matrix.zig_tarball_key }}" '.[$v][$k].shasum')
          mkdir -p "$RUNNER_TEMP/zig"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/zig.pkg"
          echo "$SHA  $RUNNER_TEMP/zig.pkg" | sha256sum -c -
          case "$URL" in
            *.zip) unzip -q "$RUNNER_TEMP/zig.pkg" -d "$RUNNER_TEMP/zig" && mv "$RUNNER_TEMP/zig"/zig-*/* "$RUNNER_TEMP/zig/" ;;
            *) tar -xJf "$RUNNER_TEMP/zig.pkg" -C "$RUNNER_TEMP/zig" --strip-components=1 ;;
          esac
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: OpenSSL 3 CLI for test certificates (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Unit tests (-Dtls-server)
        shell: bash
        run: zig build -Dtls-server test

      - name: Release build (-Dtls-server)
        shell: bash
        run: zig build -Dtls-server -Doptimize=ReleaseSafe

      - name: Built-in TLS hub smoke
        shell: bash
        env:
          MCP_SMOKE_TLS_REQUIRE: '1'
        run: |
          PY=python3
          command -v "$PY" >/dev/null 2>&1 || PY=python
          openssl version
          "$PY" ci/smoke_tls.py zig-out/bin/${{ matrix.binary }}

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zig_tarball_key: x86_64-linux
            binary: mcp-node
          - os: macos-latest
            zig_tarball_key: aarch64-macos
            binary: mcp-node
          - os: windows-latest
            zig_tarball_key: x86_64-windows
            zig_archive: zip
            binary: mcp-node.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION=0.16.0
          INDEX=$(curl -fsSL https://ziglang.org/download/index.json)
          URL=$(printf '%s' "$INDEX" | jq -r --arg v "$ZIG_VERSION" --arg k "${{ matrix.zig_tarball_key }}" '.[$v][$k].tarball')
          SHA=$(printf '%s' "$INDEX" | jq -r --arg v "$ZIG_VERSION" --arg k "${{ matrix.zig_tarball_key }}" '.[$v][$k].shasum')
          mkdir -p "$RUNNER_TEMP/zig"
          if [ "${{ matrix.zig_archive }}" = "zip" ]; then
            curl -fsSL "$URL" -o "$RUNNER_TEMP/zig.zip"
            echo "$SHA  $RUNNER_TEMP/zig.zip" | sha256sum -c -
            unzip -q "$RUNNER_TEMP/zig.zip" -d "$RUNNER_TEMP/zig"
            mv "$RUNNER_TEMP/zig"/zig-*/* "$RUNNER_TEMP/zig/"
          else
            curl -fsSL "$URL" -o "$RUNNER_TEMP/zig.tar.xz"
            echo "$SHA  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          fi
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Check formatting
        shell: bash
        run: zig fmt --check .

      - name: Unit tests
        shell: bash
        run: zig build test

      - name: Test floor (manifest + count)
        if: runner.os == 'Linux'
        shell: bash
        run: ci/check_tests.sh

      - name: Release build
        shell: bash
        run: zig build -Doptimize=ReleaseSafe

      - name: Smoke test (auth check + initialize)
        if: runner.os != 'Windows'
        shell: bash
        run: ci/smoke.sh

      - name: Smoke test (auth check + initialize, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ci/smoke.ps1

      - name: Python regression suite
        shell: bash
        run: |
          PY=python3
          command -v "$PY" >/dev/null 2>&1 || PY=python
          "$PY" ci/test_regressions.py

      - name: Python lifecycle edge suite
        shell: bash
        run: |
          PY=python3
          command -v "$PY" >/dev/null 2>&1 || PY=python
          "$PY" ci/test_lifecycle_edge.py

      - name: Python reverse connect suite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PY=python3
          command -v "$PY" >/dev/null 2>&1 || PY=python
          "$PY" ci/test_reverse.py

      - name: Python audit log suite
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PY=python3
          command -v "$PY" >/dev/null 2>&1 || PY=python
          "$PY" ci/test_audit.py

      - name: Upload ReleaseSafe binary
        uses: actions/upload-artifact@v6
        with:
          name: mcp-node-${{ matrix.os }}
          path: zig-out/bin/${{ matrix.binary }}
          retention-days: 7
          if-no-files-found: error

      - name: Python compat fixture suite
        shell: bash
        run: |
          PY=python3
          command -v "$PY" >/dev/null 2>&1 || PY=python
          "$PY" ci/test_compat.py

      - name: HTTP parser fuzz suite
        shell: bash
        run: |
          PY=python3
          command -v "$PY" >/dev/null 2>&1 || PY=python
          "$PY" ci/fuzz_http.py

