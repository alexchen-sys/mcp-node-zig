name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zig"
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Check formatting
        run: zig fmt --check build.zig src/main.zig
      - name: Unit tests
        run: zig build test
      - name: Release build
        run: zig build -Doptimize=ReleaseSafe
