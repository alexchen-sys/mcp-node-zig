name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-latest
            zig_key: x86_64-linux
            archive: tar
            binary: mcp-node
            native: true
          - target: aarch64-linux
            runner: ubuntu-latest
            zig_key: x86_64-linux
            archive: tar
            binary: mcp-node
            native: false
          - target: aarch64-macos
            runner: macos-latest
            zig_key: aarch64-macos
            archive: tar
            binary: mcp-node
            native: true
          - target: x86_64-windows
            runner: windows-latest
            zig_key: x86_64-windows
            archive: zip
            binary: mcp-node.exe
            native: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          ZIG_VERSION=0.16.0
          INDEX=$(curl -fsSL https://ziglang.org/download/index.json)
          URL=$(printf '%s' "$INDEX" | jq -r --arg v "$ZIG_VERSION" --arg k "${{ matrix.zig_key }}" '.[$v][$k].tarball')
          SHA=$(printf '%s' "$INDEX" | jq -r --arg v "$ZIG_VERSION" --arg k "${{ matrix.zig_key }}" '.[$v][$k].shasum')
          mkdir -p "$RUNNER_TEMP/zig"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/zig.pkg"
          echo "$SHA  $RUNNER_TEMP/zig.pkg" | sha256sum -c -
          case "$URL" in
            *.zip) unzip -q "$RUNNER_TEMP/zig.pkg" -d "$RUNNER_TEMP/zig" && mv "$RUNNER_TEMP/zig"/zig-*/* "$RUNNER_TEMP/zig/" ;;
            *) tar -xJf "$RUNNER_TEMP/zig.pkg" -C "$RUNNER_TEMP/zig" --strip-components=1 ;;
          esac
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Unit tests (native targets)
        if: matrix.native
        shell: bash
        run: zig build test

      - name: Build release binary
        shell: bash
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Smoke test (native targets)
        if: matrix.native && runner.os != 'Windows'
        shell: bash
        run: ci/smoke.sh

      - name: Smoke test (native Windows)
        if: matrix.native && runner.os == 'Windows'
        shell: pwsh
        run: ci/smoke.ps1

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          pkg="mcp-node-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$pkg"
          cp "zig-out/bin/${{ matrix.binary }}" LICENSE README.md "dist/$pkg/"
          (cd dist && tar -czf "$pkg.tar.gz" "$pkg" && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256")

      - name: Package (zip, Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkg = "mcp-node-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$pkg" | Out-Null
          Copy-Item "zig-out/bin/${{ matrix.binary }}", "LICENSE", "README.md" "dist/$pkg/"
          Compress-Archive -Path "dist/$pkg" -DestinationPath "dist/$pkg.zip"
          $h = (Get-FileHash "dist/$pkg.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $pkg.zip" | Out-File -FilePath "dist/$pkg.zip.sha256" -Encoding ascii -NoNewline

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true

      - name: Build checksum manifest
        run: |
          set -euo pipefail
          cat ./*.sha256 > SHA256SUMS.txt
          rm ./*.sha256
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
            *.zip
            SHA256SUMS.txt
          generate_release_notes: true
